<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-label="Adaptive sensor selection results dashboard">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title{font:800 28px Arial,Helvetica,sans-serif;fill:#0f172a}
      .subtitle{font:500 14px Arial,Helvetica,sans-serif;fill:#475569}
      .label{font:700 15px Arial,Helvetica,sans-serif;fill:#0f172a}
      .small{font:500 12.5px Arial,Helvetica,sans-serif;fill:#475569}
      .metric{font:800 31px Arial,Helvetica,sans-serif;fill:#0f172a}
      .green{fill:#16a34a}.blue{fill:#0284c7}.amber{fill:#d97706}.violet{fill:#7c3aed}.red{fill:#dc2626}
    </style>
  </defs>
  <rect width="1120" height="620" rx="30" fill="url(#bg)"/>
  <text class="title" x="44" y="52">Paper + Notebook Evidence Dashboard</text>
  <text class="subtitle" x="44" y="78">Synthetic AIoT sensor-selection results summarized with clean, non-overlapping visual cards.</text>

  <g filter="url(#shadow)">
    <rect x="44" y="112" width="238" height="126" rx="22" fill="#ffffff"/>
    <text class="label" x="66" y="146">Published validation</text>
    <text class="metric green" x="66" y="194">97%</text>
    <text class="small" x="66" y="219">Decision-tree sensor-selection accuracy</text>

    <rect x="312" y="112" width="238" height="126" rx="22" fill="#ffffff"/>
    <text class="label" x="334" y="146">Notebook synthetic run</text>
    <text class="metric blue" x="334" y="194">99.73%</text>
    <text class="small" x="334" y="219">Expanded generated dataset scaffold</text>

    <rect x="580" y="112" width="238" height="126" rx="22" fill="#ffffff"/>
    <text class="label" x="602" y="146">Energy reduction</text>
    <text class="metric amber" x="602" y="194">up to 30%</text>
    <text class="small" x="602" y="219">Reported overall paper improvement</text>

    <rect x="848" y="112" width="228" height="126" rx="22" fill="#ffffff"/>
    <text class="label" x="870" y="146">Response time</text>
    <text class="metric violet" x="870" y="194">70%</text>
    <text class="small" x="870" y="219">Reported improvement vs. fixed setup</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="44" y="278" width="500" height="252" rx="24" fill="#ffffff"/>
    <text class="label" x="70" y="314">Adaptive vs. fixed scenario summary</text>
    <text class="small" x="70" y="338">Representative values from the published paper tables.</text>

    <g transform="translate(84 374)">
      <text class="small" x="0" y="14">Clear, low traffic</text>
      <rect x="150" y="0" width="220" height="16" rx="8" fill="#e5e7eb"/>
      <rect x="150" y="0" width="216" height="16" rx="8" fill="#16a34a"/>
      <text class="small" x="386" y="14">98%</text>

      <text class="small" x="0" y="58">Foggy, high traffic</text>
      <rect x="150" y="44" width="220" height="16" rx="8" fill="#e5e7eb"/>
      <rect x="150" y="44" width="211" height="16" rx="8" fill="#0284c7"/>
      <text class="small" x="386" y="58">96%</text>

      <text class="small" x="0" y="102">Night, high traffic</text>
      <rect x="150" y="88" width="220" height="16" rx="8" fill="#e5e7eb"/>
      <rect x="150" y="88" width="213" height="16" rx="8" fill="#7c3aed"/>
      <text class="small" x="386" y="102">97%</text>
    </g>

    <text class="small" x="70" y="504">Accuracy bars represent adaptive selection accuracy, not real-world deployment certification.</text>

    <rect x="584" y="278" width="492" height="252" rx="24" fill="#ffffff"/>
    <text class="label" x="610" y="314">Latency path comparison</text>
    <text class="small" x="610" y="338">Optimized processing path from the paper and notebook latency simulation.</text>

    <g transform="translate(630 374)">
      <text class="small" x="0" y="14">Drowsiness sensor</text>
      <rect x="158" y="0" width="230" height="16" rx="8" fill="#e5e7eb"/>
      <rect x="158" y="0" width="46" height="16" rx="8" fill="#16a34a"/>
      <text class="small" x="404" y="14">10 ms edge</text>

      <text class="small" x="0" y="58">Vehicle module</text>
      <rect x="158" y="44" width="230" height="16" rx="8" fill="#e5e7eb"/>
      <rect x="158" y="44" width="92" height="16" rx="8" fill="#0284c7"/>
      <text class="small" x="404" y="58">20 ms server</text>

      <text class="small" x="0" y="102">Proximity alert</text>
      <rect x="158" y="88" width="230" height="16" rx="8" fill="#e5e7eb"/>
      <rect x="158" y="88" width="23" height="16" rx="8" fill="#dc2626"/>
      <text class="small" x="404" y="102">5 ms V2V</text>
    </g>

    <text class="small" x="610" y="504">Shorter bars indicate lower optimized latency. Baseline in paper tables is 50 ms.</text>
  </g>

  <rect x="44" y="560" width="1032" height="34" rx="17" fill="#e0f2fe" stroke="#0891b2"/>
  <text class="small" x="560" y="582" text-anchor="middle">Boundary: synthetic/published experimental evidence for research; not traffic-control, surveillance, or emergency-response software.</text>
</svg>
