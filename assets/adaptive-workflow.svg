<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-label="Adaptive sensor selection workflow">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#eef2ff"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 z" fill="#2563eb"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <style>.title{font:800 27px Arial,Helvetica,sans-serif;fill:#0f172a}.label{font:700 17px Arial,Helvetica,sans-serif;fill:#0f172a}.small{font:500 13px Arial,Helvetica,sans-serif;fill:#475569}.arrow{stroke:#2563eb;stroke-width:3;marker-end:url(#arrow);fill:none}</style>
  </defs>
  <rect width="1100" height="430" rx="28" fill="url(#bg)"/>
  <text class="title" x="44" y="54">Adaptive AIoT Sensor Selection Workflow</text>
  <text class="small" x="44" y="80">Synthetic smart-city sensing pipeline for transparent energy, latency, and safety trade-off analysis.</text>
  <g filter="url(#shadow)">
    <rect x="46" y="130" width="165" height="92" rx="20" fill="#ffffff"/>
    <text class="label" x="69" y="165">Scenario Input</text>
    <text class="small" x="69" y="191">time, traffic,</text><text class="small" x="69" y="210">weather, visibility</text>
    <rect x="256" y="130" width="165" height="92" rx="20" fill="#ffffff"/>
    <text class="label" x="282" y="165">Feature Layer</text>
    <text class="small" x="282" y="191">risk, density,</text><text class="small" x="282" y="210">energy budget</text>
    <rect x="466" y="130" width="165" height="92" rx="20" fill="#ffffff"/>
    <text class="label" x="492" y="165">Selection Policy</text>
    <text class="small" x="492" y="191">choose sensor</text><text class="small" x="492" y="210">group dynamically</text>
    <rect x="676" y="130" width="165" height="92" rx="20" fill="#ffffff"/>
    <text class="label" x="704" y="165">Evaluation</text>
    <text class="small" x="704" y="191">energy, latency,</text><text class="small" x="704" y="210">coverage, safety</text>
    <rect x="886" y="130" width="165" height="92" rx="20" fill="#ffffff"/>
    <text class="label" x="913" y="165">Audit Output</text>
    <text class="small" x="913" y="191">figures, reports,</text><text class="small" x="913" y="210">decision trace</text>
  </g>
  <path class="arrow" d="M211 176 L256 176"/><path class="arrow" d="M421 176 L466 176"/><path class="arrow" d="M631 176 L676 176"/><path class="arrow" d="M841 176 L886 176"/>
  <g filter="url(#shadow)">
    <rect x="82" y="290" width="936" height="72" rx="20" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text class="label" x="110" y="322">Research boundary</text>
    <text class="small" x="110" y="348">All results should be treated as synthetic decision-support signals. Real deployment requires calibrated sensors, privacy review, safety engineering, and city governance.</text>
  </g>
</svg>