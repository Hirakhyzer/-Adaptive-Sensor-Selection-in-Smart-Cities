<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Adaptive Sensor Selection in Smart Cities banner">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="42%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <radialGradient id="cyan" cx="16%" cy="16%" r="76%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".50"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="green" cx="86%" cy="12%" r="76%">
      <stop offset="0%" stop-color="#34d399" stop-opacity=".46"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".35"/></filter>
    <style>
      .title{font:800 48px Arial,Helvetica,sans-serif;fill:#f8fafc;letter-spacing:-1px}
      .sub{font:700 22px Arial,Helvetica,sans-serif;fill:#a7f3d0}
      .small{font:500 16px Arial,Helvetica,sans-serif;fill:#cbd5e1}
      .chip{font:700 15px Arial,Helvetica,sans-serif;fill:#ecfeff}
      .tiny{font:500 12px Arial,Helvetica,sans-serif;fill:#94a3b8}
    </style>
  </defs>
  <rect width="1200" height="360" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="30" fill="url(#cyan)"/>
  <rect width="1200" height="360" rx="30" fill="url(#green)"/>
  <g opacity=".16" stroke="#e0f2fe" stroke-width="1.1" fill="none">
    <path d="M56 80 C190 35 300 155 430 90 S690 50 840 112 S1010 200 1135 116"/>
    <path d="M80 278 C238 205 400 325 555 244 S810 172 930 260 S1080 312 1150 238"/>
    <path d="M130 52 L300 138 L485 74 L682 190 L905 84 L1110 176"/>
  </g>
  <g opacity=".5">
    <circle cx="130" cy="52" r="5" fill="#22d3ee"/><circle cx="300" cy="138" r="5" fill="#34d399"/>
    <circle cx="485" cy="74" r="5" fill="#38bdf8"/><circle cx="682" cy="190" r="5" fill="#f59e0b"/>
    <circle cx="905" cy="84" r="5" fill="#a78bfa"/><circle cx="1110" cy="176" r="5" fill="#f472b6"/>
    <circle cx="930" cy="260" r="5" fill="#67e8f9"/><circle cx="400" cy="325" r="5" fill="#86efac"/>
  </g>
  <g transform="translate(66 76)">
    <text class="title" x="0" y="54">Adaptive Sensor Selection</text>
    <text class="sub" x="0" y="91">Smart Cities • AIoT • Energy-Aware Traffic Monitoring</text>
    <text class="small" x="0" y="129">Synthetic sensor dataset and decision-support lab for dynamic sensor group selection, latency reduction, and urban safety analytics.</text>
    <g transform="translate(0 168)">
      <rect x="0" y="0" width="96" height="34" rx="17" fill="#0e7490" opacity=".90"/>
      <text class="chip" x="48" y="23" text-anchor="middle">AIoT</text>
      <rect x="112" y="0" width="154" height="34" rx="17" fill="#047857" opacity=".90"/>
      <text class="chip" x="189" y="23" text-anchor="middle">Smart Sensors</text>
      <rect x="282" y="0" width="164" height="34" rx="17" fill="#1d4ed8" opacity=".90"/>
      <text class="chip" x="364" y="23" text-anchor="middle">Traffic Safety</text>
      <rect x="462" y="0" width="164" height="34" rx="17" fill="#b45309" opacity=".90"/>
      <text class="chip" x="544" y="23" text-anchor="middle">Energy-Aware</text>
      <rect x="642" y="0" width="132" height="34" rx="17" fill="#6d28d9" opacity=".90"/>
      <text class="chip" x="708" y="23" text-anchor="middle">Low Latency</text>
    </g>
    <text class="tiny" x="0" y="246">Research prototype boundary: synthetic data only — not official city infrastructure control software.</text>
  </g>
  <g filter="url(#shadow)" transform="translate(865 80)">
    <rect x="0" y="0" width="250" height="198" rx="28" fill="#020617" opacity=".62" stroke="#334155"/>
    <circle cx="125" cy="80" r="54" fill="#0f172a" stroke="#67e8f9" stroke-width="4"/>
    <path d="M86 82 L124 48 L164 82 L124 118 Z" fill="none" stroke="#34d399" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="86" cy="82" r="7" fill="#22d3ee"/><circle cx="124" cy="48" r="7" fill="#f59e0b"/><circle cx="164" cy="82" r="7" fill="#a78bfa"/><circle cx="124" cy="118" r="7" fill="#34d399"/>
    <text class="small" x="125" y="156" text-anchor="middle">Dynamic Sensor Groups</text>
    <text class="tiny" x="125" y="181" text-anchor="middle">energy • latency • visibility • safety</text>
  </g>
</svg>
