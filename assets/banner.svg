<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Adaptive AIoT sensor selection banner">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="48%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <radialGradient id="glowA" cx="16%" cy="18%" r="70%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="88%" cy="12%" r="72%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#000" flood-opacity="0.34"/></filter>
    <style>
      .title{font:800 46px Arial,Helvetica,sans-serif;fill:#f8fafc;letter-spacing:-1px}
      .subtitle{font:700 22px Arial,Helvetica,sans-serif;fill:#a7f3d0}
      .body{font:500 16px Arial,Helvetica,sans-serif;fill:#d1d5db}
      .chip{font:700 14px Arial,Helvetica,sans-serif;fill:#ecfeff}
      .small{font:600 13px Arial,Helvetica,sans-serif;fill:#cbd5e1}
      .tiny{font:500 12px Arial,Helvetica,sans-serif;fill:#94a3b8}
    </style>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glowA)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glowB)"/>

  <g opacity="0.17" stroke="#e0f2fe" stroke-width="1.1" fill="none">
    <path d="M60 76 C190 28 312 150 450 90 S710 38 850 112 S1035 210 1140 118"/>
    <path d="M80 284 C248 198 405 322 560 244 S810 174 940 260 S1090 318 1150 240"/>
    <path d="M132 50 L298 138 L485 74 L682 188 L902 82 L1110 174"/>
  </g>

  <g transform="translate(66 66)">
    <text class="title" x="0" y="55">Adaptive AIoT Sensor Selection</text>
    <text class="subtitle" x="0" y="92">Smart Cities • Traffic Safety • Energy Efficiency</text>
    <text class="body" x="0" y="130">Dynamic sensor group selection for real-time monitoring, low-latency response,</text>
    <text class="body" x="0" y="154">edge/V2V communication, and safety-aware smart-city sensing.</text>

    <g transform="translate(0 190)">
      <rect x="0" y="0" width="92" height="34" rx="17" fill="#0e7490" opacity="0.92"/>
      <text class="chip" x="46" y="22" text-anchor="middle">AIoT</text>
      <rect x="108" y="0" width="150" height="34" rx="17" fill="#047857" opacity="0.92"/>
      <text class="chip" x="183" y="22" text-anchor="middle">Sensor Fusion</text>
      <rect x="274" y="0" width="132" height="34" rx="17" fill="#1d4ed8" opacity="0.92"/>
      <text class="chip" x="340" y="22" text-anchor="middle">Edge + V2V</text>
      <rect x="422" y="0" width="152" height="34" rx="17" fill="#b45309" opacity="0.92"/>
      <text class="chip" x="498" y="22" text-anchor="middle">Duty Cycling</text>
      <rect x="590" y="0" width="138" height="34" rx="17" fill="#6d28d9" opacity="0.92"/>
      <text class="chip" x="659" y="22" text-anchor="middle">Smart Cities</text>
    </g>

    <text class="tiny" x="0" y="270">Based on the published AIoT traffic-monitoring paper and the uploaded notebook implementation scaffold.</text>
  </g>

  <g filter="url(#shadow)" transform="translate(850 70)">
    <rect x="0" y="0" width="286" height="218" rx="28" fill="#020617" opacity="0.66" stroke="#334155"/>
    <text class="small" x="143" y="42" text-anchor="middle">Context-aware selection</text>
    <g transform="translate(58 68)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M40 54 L88 18 L136 54 L88 92 Z" stroke="#34d399"/>
      <path d="M40 54 H136" stroke="#22d3ee" opacity="0.75"/>
      <path d="M88 18 V92" stroke="#a78bfa" opacity="0.75"/>
    </g>
    <g fill="#f8fafc">
      <circle cx="98" cy="122" r="8"/><circle cx="146" cy="86" r="8"/><circle cx="194" cy="122" r="8"/><circle cx="146" cy="160" r="8"/>
    </g>
    <text class="tiny" x="143" y="190" text-anchor="middle">weather • traffic • time • visibility</text>
  </g>
</svg>
